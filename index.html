<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="./icon.svg" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, viewport-fit=cover"
    />
    <meta name="theme-color" content="#0f8168" />
    <script>
      // Resolve o tema antes do primeiro paint (evita flash claro/escuro).
      (function () {
        try {
          var v = localStorage.getItem('sbar-theme');
          var pref = v === 'light' || v === 'dark' ? v : 'system';
          var dark =
            pref === 'dark' ||
            (pref === 'system' &&
              window.matchMedia('(prefers-color-scheme: dark)').matches);
          var el = document.documentElement;
          el.classList.toggle('dark', dark);
          el.style.colorScheme = dark ? 'dark' : 'light';
          var m = document.querySelector('meta[name="theme-color"]');
          if (m) m.setAttribute('content', dark ? '#0b111c' : '#0f8168');
        } catch (e) {}
      })();
    </script>
    <meta
      name="description"
      content="Passagem de plantão (SBAR) — dados 100% no seu aparelho."
    />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="SBAR" />
    <link rel="apple-touch-icon" href="./apple-touch-icon-180x180.png" />
    <title>SBAR Médico</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
